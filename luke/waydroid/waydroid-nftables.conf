# Include this from the host firewall. It intentionally does not flush tables.
define WAYDROID_NET = 192.168.240.0/24
define WAYDROID_IF = "waydroid0"

table inet luke_waydroid {
  chain forward {
    type filter hook forward priority filter; policy accept;
    iifname $WAYDROID_IF oifname != $WAYDROID_IF accept
    iifname != $WAYDROID_IF oifname $WAYDROID_IF ct state established,related accept
  }
}

table ip luke_waydroid_nat {
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr $WAYDROID_NET oifname != $WAYDROID_IF masquerade
  }
}