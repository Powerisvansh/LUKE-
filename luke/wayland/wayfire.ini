## Luke Wayfire session. Wayfire handles composition and gestures; Luke apps
## provide the launcher, panel, and quick settings surface.

[core]
plugins = alpha animate autostart command expo fast-switcher oswitch place resize switcher vswitch wobbly wm-actions
close_top_view = <super>q
vheight = 1
vwidth = 2

[autostart]
panel = wf-shell
luke-shell = /home/aman/.luke/bin/luke-bootstrap.sh
waydroid-session = /usr/bin/waydroid session start

[command]
launcher = /home/aman/.luke/bin/luke-launcher
quick-settings = /home/aman/.luke/bin/luke-quick

[command-exec]
binding_launcher = <super>l
command_launcher = launcher
binding_quick = <super>s
command_quick = quick-settings

[vswitch]
binding_left = <super>left
binding_right = <super>right

[expo]
toggle = <super>e
duration = 180

[animate]
open_animation = zoom
close_animation = zoom
duration = 180

[place]
mode = center

[wm-actions]
toggle_fullscreen = <super>f
toggle_maximize = <super>m

# Touch scaling belongs in the compositor/input stack and GTK settings, not a
# fake Wayfire option. Configure libinput calibration and GTK scale per device.